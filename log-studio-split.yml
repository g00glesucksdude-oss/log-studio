name: Log Studio split render

# Started automatically by the page for any video/audio part that is too long for one 6 hour job.
# plan   : cuts the part into chunks that each fit the time limit; odd chunks go to the worker repo
# render : renders this repo's chunks in parallel (video without sound + lossless FLAC) into Drive stage/
# notify : the last chunk to finish wakes the merge workflow, which joins and uploads
run-name: split ${{ inputs.prefix }} part ${{ inputs.part_idx }}/${{ inputs.part_total }}

on:
  workflow_dispatch:
    inputs:
      source_folder:
        description: "Drive job folder ID (the web page fills this in)"
        required: true
      segments:
        description: "JSON [[start_s,end_s],...] of this output part; blank = entire"
        required: false
        default: ""
      kind:
        type: choice
        options: [video, audio]
        default: video
      prefix:
        required: false
        default: "log"
      title:
        required: false
        default: ""
      quality:
        required: false
        default: "10"
      mode:
        type: choice
        options: [visualizer, still]
        default: visualizer
      resolution:
        type: choice
        options: [1280x720, 1920x1080, 854x480]
        default: 1280x720
      youtube:
        type: boolean
        default: true
      drive_copy:
        type: boolean
        default: false
      stamp:
        type: boolean
        default: false
      lite:
        type: boolean
        default: false
      group:
        required: false
        default: ""
      part_idx:
        required: false
        default: "1"
      part_total:
        required: false
        default: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      stage: ${{ steps.p.outputs.stage }}
      has_a: ${{ steps.p.outputs.has_a }}
      matrix_a: ${{ steps.p.outputs.matrix_a }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q google-api-python-client google-auth google-auth-httplib2
      - name: Plan
        id: p
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}   # Drive account
          WORKER_REPO: ${{ vars.WORKER_REPO }}          # optional: owner/name of repo B
          WORKER_PAT: ${{ secrets.WORKER_PAT }}          # optional: token that may start repo B
          E_REPO_A: ${{ vars.E_REPO_A }}                 # optional speed factors (1 = normal)
          E_REPO_B: ${{ vars.E_REPO_B }}
          IN_SRC: ${{ inputs.source_folder }}
          IN_SEGMENTS: ${{ inputs.segments }}
          IN_PREFIX: ${{ inputs.prefix }}
          IN_TITLE: ${{ inputs.title }}
          IN_Q: ${{ inputs.quality }}
          IN_YT: ${{ inputs.youtube }}
          IN_COPY: ${{ inputs.drive_copy }}
          IN_STAMP: ${{ inputs.stamp }}
          IN_LITE: ${{ inputs.lite }}
          IN_GROUP: ${{ inputs.group }}
          IN_PIDX: ${{ inputs.part_idx }}
          IN_PTOT: ${{ inputs.part_total }}
        run: |
          EXTRA=""
          if [ "$IN_YT" != "true" ]; then EXTRA="$EXTRA --no-youtube"; fi
          if [ "$IN_COPY" = "true" ]; then EXTRA="$EXTRA --drive-copy"; fi
          if [ "$IN_STAMP" = "true" ]; then EXTRA="$EXTRA --stamp"; fi
          if [ "$IN_LITE" = "true" ]; then EXTRA="$EXTRA --lite"; fi
          python cloud_pipeline.py plan $EXTRA \
            --source-folder "$IN_SRC" --segments "$IN_SEGMENTS" \
            --group "$IN_GROUP" --part-idx "$IN_PIDX" --part-total "$IN_PTOT" \
            --kind "${{ inputs.kind }}" --prefix "$IN_PREFIX" --title "$IN_TITLE" \
            --quality "$IN_Q" --mode "${{ inputs.mode }}" --res "${{ inputs.resolution }}"

  render:
    needs: plan
    if: needs.plan.outputs.has_a == 'true'
    name: render chunk ${{ matrix.idx }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix_a) }}
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          if [ -d /mnt ] && sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work; then
            echo "TMPDIR=/mnt/work" >> "$GITHUB_ENV"        # the big second disk
          fi
          df -h / /mnt || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q numpy google-api-python-client google-auth google-auth-httplib2
      - name: Render chunk
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}   # Drive account
          IN_SRC: ${{ inputs.source_folder }}
          STAGE: ${{ needs.plan.outputs.stage }}
          IDX: ${{ matrix.idx }}
        run: python cloud_pipeline.py render-chunk --source-folder "$IN_SRC" --stage "$STAGE" --idx "$IDX"

  notify:
    needs: [plan, render]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # lets this repo wake its own merge workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q google-api-python-client google-auth google-auth-httplib2
      - name: Start the merge when every chunk is in
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}   # Drive account
          IN_SRC: ${{ inputs.source_folder }}
          STAGE: ${{ needs.plan.outputs.stage }}
          MERGE_REPO: ${{ vars.MAIN_REPO || github.repository }}
          MERGE_TOKEN: ${{ secrets.MAIN_PAT || github.token }}
        run: python cloud_pipeline.py check-merge --source-folder "$IN_SRC" --stage "$STAGE"
