name: Log Studio

run-name: ${{ inputs.action == 'export' && format('export {0} part {1}/{2}', inputs.prefix, inputs.part_idx, inputs.part_total) || 'ingest' }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "ingest = build waveform for the web page, export = render and upload"
        type: choice
        options: [ingest, export]
        default: ingest
      source_folder:
        description: "Drive job folder ID (the web page fills this in)"
        required: true
      segments:
        description: "Export: JSON [[start_s,end_s],...]; blank = entire"
        required: false
        default: ""
      kind:
        description: "Export: audio (.ogg) or video (.mp4)"
        type: choice
        options: [video, audio]
        default: video
      prefix:
        description: "Export: file name prefix"
        required: false
        default: "log"
      title:
        description: "Export: YouTube title (blank = prefix)"
        required: false
        default: ""
      part_min:
        description: "Export: part length in minutes (0 = one file)"
        required: false
        default: "600"
      quality:
        description: "Export: Vorbis quality 0-10 (audio)"
        required: false
        default: "10"
      mode:
        description: "Export: video look"
        type: choice
        options: [visualizer, still]
        default: visualizer
      resolution:
        description: "Export: video size"
        type: choice
        options: [1280x720, 1920x1080, 854x480]
        default: 1280x720
      youtube:
        description: "Export video: upload to YouTube (unlisted)"
        type: boolean
        default: true
      drive_copy:
        description: "Export video: also save a public copy in the Drive outputs/video folder"
        type: boolean
        default: false
      stamp:
        description: "Append the upload date/time to titles and descriptions"
        type: boolean
        default: false
      delete_source:
        description: "Export: trash the uploaded audio from Drive when finished"
        type: boolean
        default: false
      ranged:
        description: "Export: decode only the source files this export needs (set by the page when recommended)"
        type: boolean
        default: false
      lite:
        description: "Export: half-frame-rate visualizer (faster)"
        type: boolean
        default: false
      group:
        description: "Parallel export: id shared by all parts (set by the page)"
        required: false
        default: ""
      part_idx:
        description: "Parallel export: this part's number (set by the page)"
        required: false
        default: "0"
      part_total:
        description: "Parallel export: number of parts (set by the page)"
        required: false
        default: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355            # GitHub hard limit is 360
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          if [ -d /mnt ] && sudo mkdir -p /mnt/work && sudo chown "$USER" /mnt/work; then
            echo "TMPDIR=/mnt/work" >> "$GITHUB_ENV"        # the big second disk
          fi
          df -h / /mnt || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q numpy google-api-python-client google-auth google-auth-httplib2
      - name: Run
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}   # Drive account
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}           # YouTube account
          IN_ACTION: ${{ inputs.action }}
          IN_SRC: ${{ inputs.source_folder }}
          IN_SEGMENTS: ${{ inputs.segments }}
          IN_PREFIX: ${{ inputs.prefix }}
          IN_TITLE: ${{ inputs.title }}
          IN_PART: ${{ inputs.part_min }}
          IN_Q: ${{ inputs.quality }}
          IN_YT: ${{ inputs.youtube }}
          IN_COPY: ${{ inputs.drive_copy }}
          IN_STAMP: ${{ inputs.stamp }}
          IN_DEL: ${{ inputs.delete_source }}
          IN_RANGED: ${{ inputs.ranged }}
          IN_LITE: ${{ inputs.lite }}
          IN_GROUP: ${{ inputs.group }}
          IN_PIDX: ${{ inputs.part_idx }}
          IN_PTOT: ${{ inputs.part_total }}
        run: |
          EXTRA=""
          if [ "$IN_YT" != "true" ]; then EXTRA="$EXTRA --no-youtube"; fi
          if [ "$IN_COPY" = "true" ]; then EXTRA="$EXTRA --drive-copy"; fi
          if [ "$IN_STAMP" = "true" ]; then EXTRA="$EXTRA --stamp"; fi
          if [ "$IN_DEL" = "true" ]; then EXTRA="$EXTRA --delete-source"; fi
          if [ "$IN_RANGED" = "true" ]; then EXTRA="$EXTRA --ranged"; fi
          if [ "$IN_LITE" = "true" ]; then EXTRA="$EXTRA --lite"; fi
          python cloud_pipeline.py "$IN_ACTION" $EXTRA \
            --source-folder "$IN_SRC" \
            --segments "$IN_SEGMENTS" \
            --group "$IN_GROUP" \
            --part-idx "$IN_PIDX" \
            --part-total "$IN_PTOT" \
            --kind "${{ inputs.kind }}" \
            --prefix "$IN_PREFIX" \
            --title "$IN_TITLE" \
            --part-min "$IN_PART" \
            --quality "$IN_Q" \
            --mode "${{ inputs.mode }}" \
            --res "${{ inputs.resolution }}"
