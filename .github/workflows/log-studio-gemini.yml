name: Log Studio Gemini upload

# Started by the page's Gemini chat ("Attach audio"). Downloads the chosen audio exports from Drive, uploads
# them to Gemini (kept for 48 hours) and leaves the references in Drive, so your phone never uploads the audio.
run-name: gemini ${{ inputs.req }}

on:
  workflow_dispatch:
    inputs:
      file_ids:
        description: "Comma separated Drive file IDs (the page fills this in)"
        required: true
      workspace:
        description: "Logger workspace folder ID"
        required: true
      req:
        description: "Request id"
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q google-api-python-client google-auth google-auth-httplib2
      - name: Upload to Gemini
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}   # Drive account
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}               # Google AI Studio key
          IN_IDS: ${{ inputs.file_ids }}
          IN_WS: ${{ inputs.workspace }}
          IN_REQ: ${{ inputs.req }}
        run: python cloud_pipeline.py gemini-upload --ids "$IN_IDS" --workspace "$IN_WS" --req "$IN_REQ"
